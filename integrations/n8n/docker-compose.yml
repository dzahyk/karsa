# Self-hosted n8n for the Karsa intake workflow. Local only: the editor and webhooks listen on 127.0.0.1.
# Start with ./setup.sh (it creates .env, imports and activates the workflow).
services:
  n8n:
    image: n8nio/n8n:${N8N_IMAGE_TAG:-2.48.7}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file: .env
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      N8N_SECURE_COOKIE: "false"
      # No telemetry, update checks, templates or onboarding calls to n8n's servers.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # The Code nodes read KARSA_* settings from the environment and append JSON lines under /files.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: fs
      N8N_RESTRICT_FILE_ACCESS_TO: /files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files
      - ./workflows:/workflows:ro

volumes:
  n8n_data:
