[project]
name = "decisionflow-api"
version = "0.1.0"
description = "DecisionFlow AI — portfolio API (synthetic data only)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "anthropic>=0.70",
  "pypdf>=5.0",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 135
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"app/evaluation/heldout.py" = ["E501"]
"app/evaluation/dataset.py" = ["E501"]
